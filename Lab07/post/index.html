<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TASK B1 (1 pt): Add Tailwind Play CDN in <head> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: Tahoma, sans-serif;
      }
    </style>

    <title>Send Message (POST)</title>
  </head>

  <body class="min-h-screen min-w-screen justify-center items-center flex">
    <!-- TASK B1 (3 pts): Create a card layout with:
      - Title: Send Message (POST)
      - Text input (id="msg", placeholder="Type a message...")
      - Button (id="btnSend") text: "Send"
      - Status text area (id="status")
      - Output area (id="output") for showing JSON response
      - Use at least 6 Tailwind utility classes
    -->

    <!-- Your UI here -->
    <div class="flex flex-col items-start justify-center w-3/4 border-3 border-gray-200 rounded-2xl p-8 gap-y-6">
      <h1 class="title text-4xl font-bold">Send Message (POST)</h1>
      <input class="w-full border-3 border-gray-200 rounded-md p-2 text-xl" type="text" id="msg" placeholder="Type a message...">
      <div class="flex flex-row gap-x-4">
        <button id="btnSend" class="text-xl font-bold hover:bg-blue-700 disabled:opacity-50 cursor-pointer bg-blue-500 px-5 py-3 rounded-md text-white">Send</button>
        <button id="btnClear" class="text-xl font-bold cursor-pointer hover:bg-red-700 bg-red-500 px-5 py-3 rounded-md text-white">Clear</button>
      </div>
      <span id="status" class="text-xl text-gray-500">...</span>
      <div id="output"></div>
    </div>

    <!-- TASK B1 (1 pt): Link post/app.js (use defer) -->
    <!-- Hint: <script src="./app.js" defer></script> -->
    <script src="./app.js" defer></script>


  </body>
</html>
