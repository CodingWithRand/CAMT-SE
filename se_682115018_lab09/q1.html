<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:focus{
        opacity: 0.5;
      }

    </style>
  </head>
  <body>
    <button data-bg-color="red">red</button>
    <button data-bg-color="green">green</button>
    <button data-bg-color="blue">blue</button>
    <script>
      const buttons = document.querySelectorAll("button")
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          document.body.style.backgroundColor = btn.dataset.bgColor
        })
      })
    </script>
  </body>
</html>
