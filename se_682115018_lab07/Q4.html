<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Task 4: Multiple Interactions</title>
    <style>
      body {
        transition: background-color 200ms ease;
      }
    </style>
  </head>
  <body>
    <!-- 3 buttons with IDs: bgBtn, toggleBtn, countBtn.
    	1 paragraph for hidden text (id="secret").
      1 paragraph for counter display (id="count").
 -->
    <button id="bgBtn">Change Background</button>
    <button id="toggleBtn">Show/Hide Text</button>
    <button id="countBtn">Counter</button>
    <p id="secret" style="display: none;">🤫 Hidden text revealed!</p>
    <p id="count">Clicked 0 times</p>
    <script>
      // select all elements with getElementById.
      const bgBtn = document.getElementById("bgBtn");
      const toggleBtn = document.getElementById("toggleBtn");
      const countBtn = document.getElementById("countBtn");

      const secretText = document.getElementById("secret");
      const countDisplay = document.getElementById("count");
      // 1) Change background color when bgBtn is clicked
      const colors = ["#fef3c7", "#e0f2fe", "#e9d5ff", "#dcfce7"];
      let i = 0;
      bgBtn.addEventListener("click", () => {
        document.body.style.backgroundColor = colors[i];
        i = (i + 1) % colors.length;
      })
      // 2) Show/hide text when toggleBtn is clicked
      toggleBtn.addEventListener("click", () => {
        secretText.style.display = secretText.style.display === "none" ? "block" : "none";
      })
      // 3) Update a counter when countBtn is clicked
      let count = 0;
      countBtn.addEventListener("click", () => {
        count++;
        countDisplay.textContent = `Clicked ${count} times`;
      })
      
    </script>
  </body>
</html>
